name: Update tree-sitter grammars

# 同梱している tree-sitter の実行系と文法は、言語仕様の変化に追随して更新される。
# 週に一度、上流の新しい版を取り込み、fixture 検証を通してから PR を作る。
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.1.2

      - name: 依存を導入する
        working-directory: app
        run: mise exec -- pnpm install --frozen-lockfile

      - name: 更新前のバージョンを控える
        working-directory: app
        run: node scripts/grammar-versions.mjs > /tmp/before.json

      - name: tree-sitter 関連を最新へ上げる
        working-directory: app
        run: mise exec -- pnpm update --latest "web-tree-sitter" "tree-sitter-*"

      - name: 文法を取り込み直す
        working-directory: app
        run: node scripts/fetch-tree-sitter.mjs

      # 文法や tags クエリの互換が崩れると、fixture の期待宣言との差分として落ちる。
      # PR を作る前にここで判定する（GITHUB_TOKEN で作った PR は他の workflow を
      # 起動しないため、PR 作成後の CI には頼れない）。
      - name: fixture で索引を検証する
        working-directory: app
        run: mise exec -- pnpm test:run

      - name: 型検査
        working-directory: app
        run: mise exec -- pnpm typecheck

      - name: 更新後のバージョンと差分をまとめる
        id: report
        working-directory: app
        run: |
          node scripts/grammar-versions.mjs > /tmp/after.json
          node scripts/grammar-update-report.mjs /tmp/before.json /tmp/after.json > /tmp/body.md
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR を作る
        if: steps.report.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/update-tree-sitter-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: tree-sitter の実行系と文法を更新する"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: tree-sitter の文法を更新する" \
            --body-file /tmp/body.md
